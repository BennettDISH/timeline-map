[build]
builder = "nixpacks"

[deploy]
# Keep the start command pinned: Nixpacks may take a Vite + React app for a static site and start
# Caddy instead, which would serve no API and an empty dist/
startCommand = "npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
healthcheckPath = "/health"
